schema: spec-driven

context: |
  huedash is a self-hosted web dashboard for Philips Hue, aiming for feature
  parity with the official Hue mobile app.

  Desktop first: Philips has a mobile app but no desktop experience, so huedash
  is designed mainly for desktop browsers. Phone viewports must work, but layout
  and interaction decisions favor desktop (mouse, keyboard, wide screens).

  Deployment:
  - Ships as a Docker image, run with docker compose on the user's LAN.
  - CI on GitHub Actions; images published to GHCR.

  Stack:
  - SvelteKit (Svelte 5) for UI and all server code.
  - UI: shadcn-svelte. Custom components build on bits-ui primitives when one fits.

  Architecture:
  - Hue API v2 (CLIP v2) only. The SvelteKit server talks to the bridge; the
    browser never calls the bridge directly (bridge TLS cert is not browser-trusted).
  - Hue client is generated from the openhue-api OpenAPI spec, not handwritten.
  - Config: env vars (bridge IP, app key) override; otherwise a setup wizard
    pairs with the bridge and stores config in a `/data` volume.
  - Per-device UI preferences live in browser localStorage.
  - No authentication for now.

rules:
  design:
    - Before choosing to handroll code, search for a well-maintained library.
      Record the chosen library with maintenance evidence (latest release date,
      repo activity) and the alternatives considered.
  tasks:
    - Prefer adding a maintained dependency over writing custom code.
    - Custom UI components build on bits-ui primitives when one fits.
